app = "lattice-mainnet-testnet"
primary_region = "iad"

[build]
  # Deploy from the repository root:
  # fly deploy -c deploy/testnet-follower/fly.toml .
  # flyctl resolves this path relative to this file's directory; the build
  # context is the trailing `.` (the repository root).
  dockerfile = "Dockerfile"

[env]
  # Hosted levels, outermost first. Every level shares one overlay and one
  # public read listener; select a child with ?chainPath=Nexus/testnet.
  HOSTED_CHAINS = "Nexus/testnet Nexus/testnet/swap"
  # This host's public read URL, declared for every level it hosts: a node
  # hosting Nexus (the read replica) lists Nexus/testnet through it, and this
  # node lists Nexus/testnet/swap.
  PUBLIC_READ_URL = "https://lattice-mainnet-testnet.fly.dev"
  # The P2P self-description must be an IP literal (Ivy netgroup hardening
  # rejects hostnames): the app's dedicated IPv4 (`fly ips list`).
  EXTERNAL_HOST = "169.155.61.57"
  # Optional bounded sync trace for field diagnosis.
  LATTICE_SYNC_TRACE = "/data/log/sync-trace.log"
  NEXUS_PEERS = "139b8f3639e7c515417c63bd3a652a5c6fd4a1a2d0baed8e33ea63047995fe64@lattice-mainnet-iad.fly.dev:4001 35edf67bfe3d612aeb1f0e25da9d3f0ced44dbf79d34f00c548cf9005be6eb7d@lattice-mainnet-ams.fly.dev:4001 9cace839489acb30385a9f20025cb9d6365283c81dce14cadab26507065acd4e@lattice-mainnet-sjc.fly.dev:4001"

[[mounts]]
  source = "lattice_testnet_data"
  destination = "/data"

# Nexus overlay (dials the backbones; inbound peering optional).
[[services]]
  protocol = "tcp"
  internal_port = 4001
  [[services.ports]]
    port = 4001

# Public read surface for every hosted level: 443/80 -> one listener.
[[services]]
  protocol = "tcp"
  internal_port = 8081
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    path = "/health"

# One process hosts the whole tree. Keep headroom for cold-sync execution and
# the shared content store.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
