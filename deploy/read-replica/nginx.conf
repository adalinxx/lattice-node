# Public allowlist reverse-proxy for a Lattice read-only replica.
#
# The node's HTTP API binds LOOPBACK-ONLY by design (it refuses any non-loopback
# --rpc-bind). This proxy is the ONLY public listener: it forwards a fixed
# ALLOWLIST of bounded GET read routes to 127.0.0.1:8080 and returns 403 for
# everything else — crucially /v1/status (gated + mutating: a flood would
# head-of-line-block block admission) and every POST write route. This is the
# auditor-required, tested public/internal boundary; it is enforced here, not
# by convention.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;
    # Per-IP rate limit (defense in depth; the CDN also limits + caches).
    limit_req_zone $binary_remote_addr zone=reads:10m rate=25r/s;
    limit_req_status 429;

    server {
        listen 8081 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;

        # Only GET/HEAD reach the node, and only for the allowlisted routes.
        location = /health {
            limit_req zone=reads burst=50 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        # /v1/blocks (recent list, ?before&limit) and /v1/blocks/<cid> (detail).
        location ~ ^/v1/blocks(/[^/]+)?$ {
            limit_req zone=reads burst=50 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/v1/transactions/[^/]+$ {
            limit_req zone=reads burst=50 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/v1/accounts/[^/]+$ {
            limit_req zone=reads burst=50 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        # Explorer read API: all /api/* are bounded, ungated GET reads
        # (block/tx/account/mempool/peers/chain metadata). Server-side caps and
        # CID validation live in the node; this only enforces GET-only + rate.
        location ~ ^/api/ {
            limit_req zone=reads burst=50 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        # Everything else — /v1/status, all POSTs, unknown paths — is denied.
        location / { return 403; }
    }
}
