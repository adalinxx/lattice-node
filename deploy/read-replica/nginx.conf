# Public allowlist reverse-proxy for a Lattice read-only replica.
#
# The node's operator API is loopback-only and cookie-authenticated; this proxy
# never reaches it. Its upstream is the node's public read listener on 8082
# (unauthenticated read routes only; fly does not publish 8082). This proxy is
# the ONLY published listener: it forwards a fixed
# ALLOWLIST of bounded GET read routes to 127.0.0.1:8082 and returns 403 for
# everything else — crucially /status (gated + mutating: a flood would
# head-of-line-block block admission) and every POST write route. This is the
# auditor-required, tested public/internal boundary; it is enforced here, not
# by convention.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;

    # Who counts as one client for the rate and in-flight limits.
    #
    # Every public request arrives from fly-proxy, so $remote_addr is
    # fly-proxy's address for every client on the internet: a limit keyed on it
    # throttles the whole internet as one user (a per-address cap of 2 behind
    # fly-proxy once strangled a public node to two peers). The real client is
    # the Fly-Client-IP header added by fly's `http` handler.
    #
    # Trusting that header:
    # - fly-proxy OVERWRITES it. Checked 2026-09-11 against fly's header-echo
    #   app (debug.fly.dev): a client-sent Fly-Client-IP (single, duplicated,
    #   lowercase; HTTP/1.1, HTTP/2, plain :80) arrived as the real client
    #   address. X-Forwarded-For is NOT overwritten (a client value is kept and
    #   fly appends), so never key on it.
    # - Only the `http` handler does this: fly.toml must keep `http` on every
    #   port mapped to 8081. A raw TCP or proxy_proto port would pass a
    #   client-chosen header through.
    # - A connection that does not come through fly-proxy (another machine on
    #   the org's private network, or this config reused on a public host) can
    #   send any value. So the header is honoured only from fly-proxy's egress
    #   range to machines, 172.16.0.0/16, and from loopback (already inside
    #   this boundary: it can reach the node directly). Any other source is
    #   keyed on its own address.
    # - ASSUMPTION: 172.16.0.0/16 is Fly staff's statement
    #   (community.fly.io/t/nginx-proxy-protocol-and-set-real-ip-from/24648),
    #   not observable from outside a machine. If fly moves that range the
    #   header is ignored and clients collapse onto fly-proxy's address again
    #   (over-throttling, not a bypass): after a deploy, confirm two client
    #   addresses are limited independently. /health is exempt from the rate
    #   limits below so that collapse cannot 429 fly's health check.
    geo $from_trusted_proxy {
        default        0;
        172.16.0.0/16  1;
        127.0.0.0/8    1;
    }
    # Only an address-shaped header value is used. Anything else, or no header,
    # falls back to the connecting address, so the key is never empty (nginx
    # does not account requests with an empty key).
    map "$from_trusted_proxy:$http_fly_client_ip" $client {
        "~^1:(?<fly_client_ip>[0-9A-Fa-f:.]{2,45})$"  $fly_client_ip;
        default                                       $remote_addr;
    }

    # General reads; a tighter budget for routes that perform many content
    # fetches (a block's transactions or children); and a cap on one client's
    # in-flight requests, sized above the explorer home page's ~20 parallel
    # requests.
    limit_req_zone  $client zone=reads:10m     rate=25r/s;
    limit_req_zone  $client zone=expensive:10m rate=1r/s;
    limit_conn_zone $client zone=inflight:10m;
    # A deliberate ceiling on total upstream load. Per-client limits alone bound
    # only one client; the node behind this proxy is a single loopback process,
    # so enough distinct clients would still swamp it. Keyed on a constant, so
    # it is one bucket for the whole server.
    limit_req_zone  $server_name zone=global:1m rate=200r/s;
    limit_req_status  429;
    limit_conn_status 429;
    # Rejections log below the default error_log level, so a flood does not
    # also fill the disk with log lines.
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    server {
        listen 8081 default_server;
        server_name _;

        limit_conn inflight 32;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;

        # Only GET/HEAD reach the node, and only for the allowlisted routes.
        #
        # fly's health check polls /health (fly.toml): if public load could
        # throttle it, fly would depool the machine — load turning into an
        # outage. So NO rate limit here, per-client or global, and the
        # in-flight cap is raised rather than inherited (an inherited
        # limit_conn can be overridden, never unset).
        location = /health {
            limit_conn inflight 512;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location ~ ^/transactions/[^/]+$ {
            limit_req zone=reads burst=50 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }

        # Complete, locally held content Volumes. This is the Ivy binary
        # archive, not a JSON canonical-content API, and shares the expensive
        # request budget because a response can be tens of MiB.
        location ~ ^/volumes/[^/]+$ {
            limit_req zone=expensive burst=10 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_conn per_client 10;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location ~ ^/accounts/[^/]+$ {
            limit_req zone=reads burst=50 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # The costliest public reads: a block's transactions at ?limit=100 is
        # ~300 content fetches and its children ~200. Regex locations match
        # in order, so
        # this must stay above the general /api/ one.
        location ~ ^/api/block/[^/]+/(transactions|children)$ {
            limit_req zone=expensive burst=10 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # A child chain's declared read URLs: a bounded peer fan-out (a few
        # providers, one ~2s deadline, cached ~30s in the node) plus a walk of
        # the parent's recent commitments. Billed like the content-heavy reads.
        location = /api/chain/endpoints {
            limit_req zone=expensive burst=10 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # A transaction's canonical inclusion: a binary search over the
        # chain's post-states (~log2(height) account reads) plus one block's
        # transaction list.
        location ~ ^/api/transaction/[^/]+$ {
            limit_req zone=expensive burst=10 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # Block detail reads every transaction body to report the reward and
        # fees the block paid its recipient. The latest-block summary does not.
        location = /api/block/latest {
            limit_req zone=reads burst=50 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # The explorer's block list: a page of header summaries (no
        # transaction bodies), so it is a general read. An exact match wins
        # over every regex location, and `/api/blocks` is not `/api/block/`.
        location = /api/blocks {
            limit_req zone=reads burst=50 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location ~ ^/api/block/[^/]+$ {
            limit_req zone=expensive burst=10 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # Explorer read API: all /api/* are bounded, ungated GET reads
        # (block/tx/account/mempool/peers/chain metadata). Server-side caps and
        # CID validation live in the node; this only enforces GET-only + rate.
        location ~ ^/api/ {
            limit_req zone=reads burst=50 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        # Everything else — /status, all POSTs, unknown paths — is denied.
        # No limit_req: the 403 is returned here and never reaches the node, so
        # charging a bucket would only spend a real client's budget on it.
        location / { return 403; }
    }
}
